name: Android Build

on:
  push:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'version.properties'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'version.properties'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test Zyphuel Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP 9.x requires a JDK 17+ toolchain; Gradle 9.5 also runs on 21.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The wrapper is committed from Windows, where git records no exec bit.
      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      - name: Compile and run unit tests
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon --console=plain \
                :app:compileDebugKotlin :app:testDebugUnitTest 2>&1 | tee gradle.log; then
            # Public logs need auth, so publish the real diagnostics as annotations.
            MSG="$(grep -E '^e: file|error:|FAILED|Execution failed for task|Caused by:|^\* What went wrong' gradle.log \
              | awk '!seen[$0]++' | head -40 | tr '\n' '|' | tr -d '\r' | cut -c1-4000)"
            if [ -z "$MSG" ]; then
              MSG="$(tail -30 gradle.log | tr '\n' '|' | tr -d '\r' | cut -c1-4000)"
            fi
            echo "::error title=Android compile or tests failed::${MSG}"
            exit 1
          fi

      - name: Build debug APK
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon --console=plain :app:assembleDebug 2>&1 | tee assemble.log; then
            MSG="$(grep -E '^e: file|error:|FAILED|Execution failed for task|^\* What went wrong' assemble.log \
              | awk '!seen[$0]++' | head -40 | tr '\n' '|' | tr -d '\r' | cut -c1-4000)"
            if [ -z "$MSG" ]; then
              MSG="$(tail -30 assemble.log | tr '\n' '|' | tr -d '\r' | cut -c1-4000)"
            fi
            echo "::error title=APK packaging failed::${MSG}"
            exit 1
          fi

      # Play ships the minified release bundle, so measure that too: it is the size a user
      # actually downloads. It is signed with the fallback debug key, so it is only measured,
      # never uploaded or published.
      - name: Build release bundle for size
        run: |
          set -o pipefail
          if ! ./gradlew --no-daemon --console=plain :app:bundleRelease 2>&1 | tee release.log; then
            MSG="$(grep -E '^e: file|error:|FAILED|Execution failed for task|^\* What went wrong' release.log \
              | awk '!seen[$0]++' | head -40 | tr '\n' '|' | tr -d '\r' | cut -c1-4000)"
            if [ -z "$MSG" ]; then
              MSG="$(tail -30 release.log | tr '\n' '|' | tr -d '\r' | cut -c1-4000)"
            fi
            echo "::error title=Release bundle failed::${MSG}"
            exit 1
          fi

      - name: Report download size
        run: |
          set -euo pipefail
          APK="$(ls app/build/outputs/apk/debug/*.apk | head -1)"
          AAB="$(ls app/build/outputs/bundle/release/*.aab | head -1)"
          APK_BYTES="$(stat -c %s "$APK")"
          AAB_BYTES="$(stat -c %s "$AAB")"
          ls -lh "$APK" "$AAB"
          # Also exposed as an annotation: the job summary is not readable from the public API.
          echo "::notice title=Android download size::debug APK ${APK_BYTES} bytes ($(awk "BEGIN{printf \"%.2f\", ${APK_BYTES}/1048576}") MiB) | release AAB ${AAB_BYTES} bytes ($(awk "BEGIN{printf \"%.2f\", ${AAB_BYTES}/1048576}") MiB)"
          {
            echo "### Android download"
            echo ""
            echo "| artifact | bytes | MiB |"
            echo "| --- | --- | --- |"
            echo "| $(basename "$APK") (debug, installable) | ${APK_BYTES} | $(awk "BEGIN{printf \"%.2f\", ${APK_BYTES}/1048576}") |"
            echo "| $(basename "$AAB") (release, minified) | ${AAB_BYTES} | $(awk "BEGIN{printf \"%.2f\", ${AAB_BYTES}/1048576}") |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Zyphuel-android-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore
          retention-days: 7
