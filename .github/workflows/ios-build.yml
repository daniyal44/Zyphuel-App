name: iOS Build

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test Zyphuel iOS
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # Firebase iOS SDK 13.x declares `swift-tools-version:6.2`, which the macos-15
      # default Xcode 16.4 toolchain (Swift 6.1) cannot read. The image also ships
      # Xcode 26.x, so select the newest installed Xcode instead of the default.
      - name: Select newest Xcode
        run: |
          set -euo pipefail
          LATEST="$(python3 -c "import glob,re;c=[(tuple(int(n) for n in re.findall(r'\d+',p)),p) for p in glob.glob('/Applications/Xcode_*.app')];print(max(c)[1] if c else '')")"
          if [ -n "${LATEST}" ]; then
            echo "Selecting ${LATEST}"
            sudo xcode-select -s "${LATEST}"
          fi
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Resolve packages
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -version
          swift --version || true
          if ! xcodebuild -project Zyphuel.xcodeproj -scheme Zyphuel \
                -resolvePackageDependencies \
                -clonedSourcePackagesDirPath .packages 2>&1 | tee resolve.log; then
            # Public logs need auth, so surface the real reason as a check annotation.
            MSG="$(grep -iE 'error|fail|could not|unable|requirement|toolchain|tools version' resolve.log \
              | head -8 | tr '\n' ' ' | tr -d '\r' | cut -c1-900)"
            echo "::error title=Resolve packages failed::${MSG}"
            exit 1
          fi

      - name: Pick an iPhone simulator
        id: sim
        run: |
          DEVICE_ID="$(xcrun simctl list devices available | grep -m1 -E 'iPhone' | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')"
          if [ -z "$DEVICE_ID" ]; then
            echo "No iPhone simulator found" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "destination=id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $DEVICE_ID"

      - name: Build for simulator
        working-directory: ios
        run: |
          set -o pipefail
          if ! xcodebuild build \
                -project Zyphuel.xcodeproj \
                -scheme Zyphuel \
                -destination "${{ steps.sim.outputs.destination }}" \
                -derivedDataPath build \
                -Xswiftc -continue-building-after-errors \
                CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log; then
            # Public job logs need auth, so publish every unique diagnostic instead.
            MSG="$(grep -E 'error:' build.log | sed -E 's#^/Users/runner/work/Zyphuel-App/Zyphuel-App/ios/##' | awk '!seen[$0]++' | head -40 | tr '\n' '|' | tr -d '\r' | cut -c1-4000)"
            echo "::error title=Build failed::${MSG}"
            exit 1
          fi

      - name: Verify App Store readiness
        working-directory: ios
        run: |
          set -euo pipefail
          APP="build/Build/Products/Debug-iphonesimulator/Zyphuel.app"
          test -d "$APP"
          test -f "$APP/PrivacyInfo.xcprivacy"
          test -f "$APP/AppIcon60x60@2x.png"
          echo "Icon and privacy manifest are inside the app bundle."

      - name: Package simulator build
        working-directory: ios
        run: |
          set -euo pipefail
          APP="build/Build/Products/Debug-iphonesimulator/Zyphuel.app"
          test -d "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" Zyphuel-iOS-Simulator.app.zip
          ls -lh Zyphuel-iOS-Simulator.app.zip

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: Zyphuel-ios-simulator-app
          path: ios/Zyphuel-iOS-Simulator.app.zip
          if-no-files-found: error
          retention-days: 14

      - name: Run unit tests
        working-directory: ios
        run: |
          xcodebuild test \
            -project Zyphuel.xcodeproj \
            -scheme Zyphuel \
            -destination "${{ steps.sim.outputs.destination }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ios/build/**/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
