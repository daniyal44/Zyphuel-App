name: iOS Build

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test Zyphuel iOS
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # Firebase iOS SDK 13.x declares `swift-tools-version:6.2`, which the macos-15
      # default Xcode 16.4 toolchain (Swift 6.1) cannot read. The image also ships
      # Xcode 26.x, so select the newest installed Xcode instead of the default.
      - name: Select newest Xcode
        run: |
          set -euo pipefail
          LATEST="$(python3 -c "import glob,re;c=[(tuple(int(n) for n in re.findall(r'\d+',p)),p) for p in glob.glob('/Applications/Xcode_*.app')];print(max(c)[1] if c else '')")"
          if [ -n "${LATEST}" ]; then
            echo "Selecting ${LATEST}"
            sudo xcode-select -s "${LATEST}"
          fi
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Resolve packages
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -version
          swift --version || true
          if ! xcodebuild -project Zyphuel.xcodeproj -scheme Zyphuel \
                -resolvePackageDependencies \
                -clonedSourcePackagesDirPath .packages 2>&1 | tee resolve.log; then
            # Public logs need auth, so surface the real reason as a check annotation.
            MSG="$(grep -iE 'error|fail|could not|unable|requirement|toolchain|tools version' resolve.log \
              | head -8 | tr '\n' ' ' | tr -d '\r' | cut -c1-900)"
            echo "::error title=Resolve packages failed::${MSG}"
            exit 1
          fi

      - name: Pick an iPhone simulator
        id: sim
        run: |
          DEVICE_ID="$(xcrun simctl list devices available | grep -m1 -E 'iPhone' | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')"
          if [ -z "$DEVICE_ID" ]; then
            echo "No iPhone simulator found" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "destination=id=$DEVICE_ID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $DEVICE_ID"

      - name: Build for simulator
        working-directory: ios
        run: |
          set -o pipefail
          if ! xcodebuild build \
                -project Zyphuel.xcodeproj \
                -scheme Zyphuel \
                -destination "${{ steps.sim.outputs.destination }}" \
                -derivedDataPath build \
                OTHER_SWIFT_FLAGS='$(inherited) -continue-building-after-errors' \
                CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log; then
            # Public job logs need auth, so publish every unique diagnostic instead.
            MSG="$(grep -E 'error:' build.log | sed -E 's#^/Users/runner/work/Zyphuel-App/Zyphuel-App/ios/##' | awk '!seen[$0]++' | head -40 | tr '\n' '|' | tr -d '\r' | cut -c1-4000)"
            echo "::error title=Build failed::${MSG}"
            exit 1
          fi

      - name: Verify App Store readiness
        working-directory: ios
        run: |
          set -euo pipefail
          APP="build/Build/Products/Debug-iphonesimulator/Zyphuel.app"
          test -d "$APP"
          test -f "$APP/PrivacyInfo.xcprivacy"
          test -f "$APP/AppIcon60x60@2x.png"
          echo "Icon and privacy manifest are inside the app bundle."

      - name: Package simulator build
        working-directory: ios
        run: |
          set -euo pipefail
          APP="build/Build/Products/Debug-iphonesimulator/Zyphuel.app"
          test -d "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" Zyphuel-iOS-Simulator.app.zip
          ls -lh Zyphuel-iOS-Simulator.app.zip

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: Zyphuel-ios-simulator-app
          path: ios/Zyphuel-iOS-Simulator.app.zip
          if-no-files-found: error
          retention-days: 14

      # The App Store build is a signed Release device archive. This repository holds no
      # Apple certificate, so the archive is unsigned: it still proves the Release
      # configuration compiles and gives the true device-IPA size. It cannot be installed.
      - name: Archive device build (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          if ! xcodebuild archive \
                -project Zyphuel.xcodeproj \
                -scheme Zyphuel \
                -configuration Release \
                -destination 'generic/platform=iOS' \
                -archivePath Zyphuel.xcarchive \
                -derivedDataPath build-device \
                CODE_SIGNING_ALLOWED=NO \
                CODE_SIGNING_REQUIRED=NO \
                CODE_SIGN_IDENTITY="" \
                OTHER_SWIFT_FLAGS='$(inherited) -continue-building-after-errors' 2>&1 | tee archive.log; then
            MSG="$(grep -E 'error:' archive.log | sed -E 's#^/Users/runner/work/Zyphuel-App/Zyphuel-App/ios/##' | awk '!seen[$0]++' | head -40 | tr '\n' '|' | tr -d '\r' | cut -c1-4000)"
            if [ -z "$MSG" ]; then
              MSG="$(tail -30 archive.log | tr '\n' '|' | tr -d '\r' | cut -c1-4000)"
            fi
            echo "::error title=Device archive failed::${MSG}"
            exit 1
          fi

      - name: Package unsigned device IPA
        working-directory: ios
        run: |
          set -euo pipefail
          APP="Zyphuel.xcarchive/Products/Applications/Zyphuel.app"
          test -d "$APP"
          test -f "$APP/PrivacyInfo.xcprivacy"
          test -f "$APP/AppIcon60x60@2x.png"
          rm -rf ipa-staging
          mkdir -p ipa-staging/Payload
          ditto "$APP" ipa-staging/Payload/Zyphuel.app
          (cd ipa-staging && zip -qry ../Zyphuel-iOS-Device-unsigned.ipa Payload)
          ls -lh Zyphuel-iOS-Device-unsigned.ipa

      - name: Report download size
        working-directory: ios
        run: |
          set -euo pipefail
          SIM_APP="build/Build/Products/Debug-iphonesimulator/Zyphuel.app"
          ZIP="Zyphuel-iOS-Simulator.app.zip"
          IPA="Zyphuel-iOS-Device-unsigned.ipa"
          DEVICE_APP="Zyphuel.xcarchive/Products/Applications/Zyphuel.app"
          ZIP_BYTES="$(stat -f%z "$ZIP")"
          IPA_BYTES="$(stat -f%z "$IPA")"
          SIM_APP_KIB="$(du -sk "$SIM_APP" | cut -f1)"
          DEVICE_APP_KIB="$(du -sk "$DEVICE_APP" | cut -f1)"
          # The job summary is not readable from the public API, so also annotate.
          echo "::notice title=iOS download size::simulator zip ${ZIP_BYTES} bytes ($(awk "BEGIN{printf \"%.2f MiB\", ${ZIP_BYTES}/1048576}") MiB) | unsigned device IPA ${IPA_BYTES} bytes ($(awk "BEGIN{printf \"%.2f MiB\", ${IPA_BYTES}/1048576}") MiB)"
          {
            echo "### iOS download"
            echo ""
            echo "| artifact | bytes | size |"
            echo "| --- | --- | --- |"
            echo "| ${ZIP} (simulator, installable on a Mac) | ${ZIP_BYTES} | $(awk "BEGIN{printf \"%.2f MiB\", ${ZIP_BYTES}/1048576}") |"
            echo "| ${IPA} (device, unsigned — size reference only) | ${IPA_BYTES} | $(awk "BEGIN{printf \"%.2f MiB\", ${IPA_BYTES}/1048576}") |"
            echo "| Zyphuel.app (unzipped, simulator) | — | $(awk "BEGIN{printf \"%.2f MiB\", ${SIM_APP_KIB}/1024}") |"
            echo "| Zyphuel.app (unzipped, Release device) | — | $(awk "BEGIN{printf \"%.2f MiB\", ${DEVICE_APP_KIB}/1024}") |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned device IPA
        uses: actions/upload-artifact@v4
        with:
          name: Zyphuel-ios-device-ipa-unsigned
          path: ios/Zyphuel-iOS-Device-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Run unit tests
        working-directory: ios
        run: |
          set -o pipefail
          if ! xcodebuild test \
                -project Zyphuel.xcodeproj \
                -scheme Zyphuel \
                -destination "${{ steps.sim.outputs.destination }}" \
                -derivedDataPath build \
                CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log; then
            MSG="$(grep -E '(error:|XCTAssert.*failed|: error: -\[)' test.log \
              | sed -E 's#^/Users/runner/work/Zyphuel-App/Zyphuel-App/ios/##' \
              | awk '!seen[$0]++' | head -40 | tr '\n' '|' | tr -d '\r' | cut -c1-4000)"
            echo "::error title=Tests failed::${MSG}"
            exit 1
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ios/build/**/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
