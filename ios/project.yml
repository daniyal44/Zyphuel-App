name: Zyphuel
options:
  bundleIdPrefix: com.aistudio.zyphuel
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

# Dependency pins. `desktop_ios.bat` / `scripts/update_ios_versions.ps1` refresh these
# to the latest GitHub releases; the script validates the file after editing.
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "13.1.1"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "10.1.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "2.6.4.0.0.40"
    CURRENT_PROJECT_VERSION: "68"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

targets:
  Zyphuel:
    type: application
    platform: iOS
    sources:
      - path: Zyphuel
        excludes:
          - "**/*.md"
      # Apple privacy manifest: must be copied into the app bundle (App Store requirement).
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    # The git-ignored Firebase plist cannot be a project resource: a missing resource
    # reference fails the build ("Build input file cannot be found"). This copy phase
    # bundles it when it exists and leaves the app in setup mode when it does not.
    preBuildScripts:
      - name: Copy Firebase configuration (optional)
        basedOnDependencyAnalysis: false
        script: |
          SRC="${SRCROOT}/Config/GoogleService-Info.plist"
          DEST_DIR="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          if [ -f "${SRC}" ]; then
            mkdir -p "${DEST_DIR}"
            cp "${SRC}" "${DEST_DIR}/GoogleService-Info.plist"
            echo "Bundled GoogleService-Info.plist"
          else
            echo "warning: GoogleService-Info.plist missing - app starts in setup mode"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aistudio.zyphuel.appv2
        # Only this target's single copy phase needs filesystem access.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_NAME: Zyphuel
        INFOPLIST_FILE: Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Zyphuel.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseAppCheck
      - package: GoogleSignIn
        product: GoogleSignIn

  ZyphuelTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aistudio.zyphuel.appv2.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Zyphuel

schemes:
  Zyphuel:
    build:
      targets:
        Zyphuel: all
        ZyphuelTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - ZyphuelTests
    archive:
      config: Release
